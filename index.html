<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turbo Racer - Edição Especial do Levi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle, #1a1a2e 0%, #0f0f1b 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 1.6rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
    }

    .game-container {
      position: relative;
      border: 4px solid #ffd700;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 215, 0, 0.3);
    }

    canvas {
      display: block;
      background: #333;
    }

    /* HUD / Placar */
    .hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: bold;
      text-shadow: 1px 1px 4px #000;
      z-index: 5;
    }

    .pilot-tag {
      color: #00f0ff;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid #00f0ff;
    }

    /* Telas de Início e Game Over */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 15, 27, 0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      gap: 12px;
      z-index: 10;
    }

    .overlay.hidden {
      display: none;
    }

    /* Foto do Levi */
    .photo-container {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 4px solid #ffd700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
      overflow: hidden;
      animation: pulse-glow 2s infinite alternate;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    @keyframes pulse-glow {
      0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
      100% { transform: scale(1.04); box-shadow: 0 0 30px rgba(255, 215, 0, 1); }
    }

    .tribute-title {
      font-size: 1.4rem;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    .tribute-text {
      font-size: 0.95rem;
      color: #e0e0ff;
      line-height: 1.4;
      max-width: 300px;
    }

    .btn {
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #111;
      background: #ffd700;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 215, 0, 0.5);
      transition: transform 0.15s, background 0.15s;
    }

    .btn:hover {
      background: #ffea6b;
      transform: scale(1.05);
    }

    /* Controles Mobile */
    .mobile-controls {
      margin-top: 12px;
      display: flex;
      gap: 25px;
    }

    .ctrl-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: #252542;
      border: 2px solid #ffd700;
      color: #ffd700;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .instructions {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>🏆 Pista do Levi 🏎️</h1>

  <div class="game-container">
    <!-- Placar e Piloto -->
    <div class="hud">
      <span class="pilot-tag">Piloto: Levi ⭐</span>
      <span id="score">Pontos: 0</span>
    </div>

    <!-- Tela Inicial de Homenagem -->
    <div class="overlay" id="startScreen">
      <div class="photo-container">
        <img src="levi.jpg" alt="Levi" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>'"/>
      </div>
      <h2 class="tribute-title">PARABÉNS, LEVI! 🎉</h2>
      <p class="tribute-text">
        Você é o nosso maior campeão e o <b>piloto número 1</b>! Desvie dos carros e acelere fundo na sua própria pista!
      </p>
      <button class="btn" id="startBtn">Acelerar, Levi! 🚀</button>
    </div>

    <!-- Tela de Game Over -->
    <div class="overlay hidden" id="gameOverScreen">
      <h2 style="color: #ff3366; font-size: 1.6rem;">FIM DA CORRIDA!</h2>
      <p id="finalScore" style="font-size: 1.2rem; color: #ffd700;">Pontos: 0</p>
      <p style="color: #aaa; font-size: 0.9rem;">Você mandou muito bem, Levi!</p>
      <button class="btn" id="restartBtn">Tentar de Novo 🔄</button>
    </div>

    <!-- Canvas do Jogo -->
    <canvas id="gameCanvas" width="360" height="520"></canvas>
  </div>

  <!-- Controles para Celular -->
  <div class="mobile-controls">
    <button class="ctrl-btn" id="btnLeft">◀</button>
    <button class="ctrl-btn" id="btnRight">▶</button>
  </div>

  <div class="instructions">
    Use as setas <b>← / →</b> ou <b>A / D</b> para guiar.
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreDisplay = document.getElementById('score');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScore = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    const ROAD_WIDTH = 250;
    const ROAD_LEFT = (canvas.width - ROAD_WIDTH) / 2;
    const CAR_WIDTH = 40;
    const CAR_HEIGHT = 68;

    let score = 0;
    let gameSpeed = 5;
    let isPlaying = false;
    let roadOffset = 0;

    const player = {
      x: canvas.width / 2 - CAR_WIDTH / 2,
      y: canvas.height - CAR_HEIGHT - 25,
      width: CAR_WIDTH,
      height: CAR_HEIGHT,
      speedX: 5.5,
      movingLeft: false,
      movingRight: false,
      color: '#00f0ff'
    };

    let traffic = [];
    const trafficColors = ['#ff3366', '#ffaa00', '#00ff88', '#b533ff'];

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') player.movingLeft = true;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') player.movingRight = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') player.movingLeft = false;
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') player.movingRight = false;
    });

    const addHoldEvent = (btn, dir) => {
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); player[dir] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); player[dir] = false; });
      btn.addEventListener('mousedown', () => { player[dir] = true; });
      btn.addEventListener('mouseup', () => { player[dir] = false; });
      btn.addEventListener('mouseleave', () => { player[dir] = false; });
    };

    addHoldEvent(btnLeft, 'movingLeft');
    addHoldEvent(btnRight, 'movingRight');

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    function startGame() {
      score = 0;
      gameSpeed = 5.2;
      traffic = [];
      player.x = canvas.width / 2 - CAR_WIDTH / 2;
      isPlaying = true;

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');

      requestAnimationFrame(gameLoop);
    }

    function drawCar(x, y, width, height, color, isPlayer = false) {
      ctx.save();
      ctx.translate(x, y);

      // Rodas
      ctx.fillStyle = '#111';
      ctx.fillRect(-3, 8, 6, 14);
      ctx.fillRect(width - 3, 8, 6, 14);
      ctx.fillRect(-3, height - 22, 6, 14);
      ctx.fillRect(width - 3, height - 22, 6, 14);

      // Carroceria
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(0, 0, width, height, 8);
      ctx.fill();

      // Faixa esportiva dourada no carro do Levi
      if (isPlayer) {
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(width / 2 - 3, 0, 6, height);
      }

      // Vidro
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.roundRect(5, 14, width - 10, 14, 3);
      ctx.fill();

      // Faróis
      ctx.fillStyle = isPlayer ? '#ffff77' : '#ff3333';
      ctx.fillRect(5, isPlayer ? 2 : height - 4, 7, 3);
      ctx.fillRect(width - 12, isPlayer ? 2 : height - 4, 7, 3);

      ctx.restore();
    }

    let spawnTimer = 0;
    function handleTraffic() {
      spawnTimer++;
      if (spawnTimer > 65 - Math.min(gameSpeed * 2, 35)) {
        spawnTimer = 0;
        const laneX = ROAD_LEFT + 8 + Math.random() * (ROAD_WIDTH - CAR_WIDTH - 16);
        traffic.push({
          x: laneX,
          y: -CAR_HEIGHT,
          width: CAR_WIDTH,
          height: CAR_HEIGHT,
          speed: gameSpeed * 0.45 + Math.random() * 2,
          color: trafficColors[Math.floor(Math.random() * trafficColors.length)]
        });
      }

      for (let i = traffic.length - 1; i >= 0; i--) {
        const car = traffic[i];
        car.y += gameSpeed - car.speed * 0.25;

        drawCar(car.x, car.y, car.width, car.height, car.color);

        // Colisão
        if (
          player.x < car.x + car.width - 5 &&
          player.x + player.width - 5 > car.x &&
          player.y < car.y + car.height - 5 &&
          player.y + player.height - 5 > car.y
        ) {
          endGame();
        }

        if (car.y > canvas.height) {
          traffic.splice(i, 1);
          score += 15;
        }
      }
    }

    function drawRoad() {
      // Grama
      ctx.fillStyle = '#1e5e2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Asfalto
      ctx.fillStyle = '#282828';
      ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, canvas.height);

      // Faixas Laterais Douradas
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(ROAD_LEFT - 4, 0, 4, canvas.height);
      ctx.fillRect(ROAD_LEFT + ROAD_WIDTH, 0, 4, canvas.height);

      // Linha Central
      roadOffset = (roadOffset + gameSpeed) % 40;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadOffset;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function endGame() {
      isPlaying = false;
      finalScore.textContent = `Pontuação: ${Math.floor(score)}`;
      gameOverScreen.classList.remove('hidden');
    }

    function gameLoop() {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawRoad();

      if (player.movingLeft && player.x > ROAD_LEFT + 5) {
        player.x -= player.speedX;
      }
      if (player.movingRight && player.x < ROAD_LEFT + ROAD_WIDTH - CAR_WIDTH - 5) {
        player.x += player.speedX;
      }

      drawCar(player.x, player.y, player.width, player.height, player.color, true);

      handleTraffic();

      gameSpeed += 0.0012;
      score += 0.08;

      scoreDisplay.textContent = `Pontos: ${Math.floor(score)}`;

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
